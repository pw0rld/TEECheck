# This file has two parts, and the boundary between them is load-bearing.
#
# Part 1 (TWE-FLOW-001 .. TWE-LEAK-002, 16 entries): migrated verbatim from
# tee-audit's trustir/spec/twe_catalog.yml (PR-02 of the TEECheck/tee-audit
# merge, docs/TEECHECK_TEE_AUDIT_MERGE.zh-CN.md §20.1). That catalog is
# attestation-centric (built for Web3/SGX consumers of remote attestation).
#
# Part 2 (below the "TEECheck-local extensions" marker, 3 entries): added by
# TEECheck because this project's benchmark corpus is OP-TEE/TF-M kernel CVEs
# — parameter validation, memory management, crypto implementation bugs — a
# shape the migrated catalog has no entries for. See that section's own
# header comment for details. A future maintainer merging an upstream
# tee-audit catalog update should be able to replace Part 1 wholesale without
# touching Part 2.
#
# This is the fixed id/name/family/query-module anchor for all TWEs — the
# definition layer, not the experience layer. It carries no scenario, no
# investigation method, and no CodeQL obligation encoding: those belong to
# the experience Playbooks (knowledge/twe/playbooks/, internal/twecontext)
# and to the future fact/query layer (PR-05) respectively. See
# internal/twe.Definition for the Go shape and knowledge/twe/binding.yml /
# config.yml for how the two pre-existing old-format Entry records
# (TWE-BIND-001, TWE-CONFIG-001) reconcile with the entries below — same TWE
# ids, same families, a renamed TWE-CONFIG-001 (tee-audit's name is more
# specific about which weak modes qualify).
twe:
  - id: TWE-FLOW-001
    family: Flow
    name: Host-Controlled Data Reaches Enclave Security Decision
    query_modules: [flow/HostToEnclaveSecurityDecision.ql]
    required_trustir: [flow_source, flow_sink, trust_boundary, sanitizer, entrypoint]
  - id: TWE-FLOW-002
    family: Flow
    name: Secret or Key Material Leaves TEE Boundary Without Protection
    query_modules: [flow/SecretBoundaryExit.ql]
    required_trustir: [secret_source, boundary_exit, untrusted_sink, protection_guard]
  - id: TWE-GUARD-001
    family: Guard
    name: Validity-Only Attestation Consumption
    query_modules: [guard/ValidityOnlyConsumption.ql]
    required_trustir: [claim_producer, verifier_success_field, claim_fields, authority_point, required_guard_set]
  - id: TWE-GUARD-002
    family: Guard
    name: Attestation Status or TCB Appraisal Ignored
    query_modules: [guard/StatusAppraisalIgnored.ql, guard/FailOpenStatus.ql]
    required_trustir: [claim_producer, status_field, accepted_statuses, authority_point, guard_behavior]
  - id: TWE-GUARD-003
    family: Guard
    name: Missing Freshness Check Before Authority
    query_modules: [guard/MissingFreshnessCheck.ql]
    required_trustir: [freshness_field, freshness_source, authority_point, freshness_guard]
  - id: TWE-BIND-001
    family: Binding
    name: Unbound Attested Subject Authority
    query_modules: [binding/MissingSubjectBinding.ql]
    required_trustir: [claim_field, authority_subject, authority_point, required_binding_relation]
  - id: TWE-BIND-002
    family: Binding
    name: Public Key Not Bound to Report Data
    query_modules: [binding/ReportDataKeyBinding.ql]
    required_trustir: [attestation_report_field, public_key_field, binding_relation, authority_point]
  - id: TWE-BIND-003
    family: Binding
    name: Context-Free TEE Output Acceptance
    query_modules: [binding/ContextFreeOutputAcceptance.ql]
    required_trustir: [tee_output, context_fields, authority_point, binding_relation]
  # knowledge/twe/playbooks/rollback.yml is the experience layer for this
  # weakness and keys off this id.
  - id: TWE-STATE-001
    family: State
    name: Sealed State Restored Without Version or Epoch Continuity
    query_modules: [state/SealedStateRestoreWithoutVersion.ql]
    required_trustir: [state_object, state_restore_operation, continuity_guard, authority_point]
  - id: TWE-STATE-002
    family: State
    name: Replayable Attestation Result or Authorization
    query_modules: [state/ReplayableAuthorization.ql]
    required_trustir: [authorization_artifact, freshness_field, replay_cache_or_nonce_guard, authority_point]
  - id: TWE-CONFIG-001
    family: Config
    name: Debug, Simulation, or None-Attestation Mode Reaches Production Authority
    query_modules: [config/WeakModeReachesAuthority.ql]
    required_trustir: [config_source, weak_mode, authority_point, production_guard]
  - id: TWE-CONFIG-002
    family: Config
    name: Host-Controlled or Development Key Enters Trusted Runtime Authority
    query_modules: [config/DevKeyReachesRuntime.ql]
    required_trustir: [config_source, key_material, runtime_authority_point, production_guard]
  - id: TWE-DESIGN-001
    family: Design
    name: Claimed TEE Trust Path Has a Non-TEE Bypass
    query_modules: [design/BypassAuthorityPath.ql]
    required_trustir: [claimed_security_property, protected_asset, tee_trust_path, bypass_path, authority_point]
  - id: TWE-DESIGN-002
    family: Design
    name: TEE Protects the Wrong Component for the Claimed Security Property
    query_modules: [design/ProtectedWrongComponent.ql]
    required_trustir: [claimed_security_property, protected_asset, trusted_component, unprotected_critical_component]
  - id: TWE-LEAK-001
    family: Leakage
    name: Enclave Secret or Internal State Reaches Logs, Errors, or Metadata
    query_modules: [leakage/SecretToLogOrError.ql]
    required_trustir: [secret_source, observable_sink, normalizer, trust_boundary]
  - id: TWE-LEAK-002
    family: Leakage
    name: Secret-Dependent Output Length or Structure Exposed
    query_modules: [leakage/SecretDependentOutputShape.ql]
    required_trustir: [secret_source, observable_sink, normalizer, secret_dependent_branch]

  # ── TEECheck-local extensions ─────────────────────────────────────────
  # The entries above are tee-audit's, migrated verbatim. Everything below
  # was added by TEECheck because the migrated catalog is attestation-centric
  # and has no entry for these classes, each of which the benchmark corpus
  # actually contains. Each entry records the dev-half CVEs it generalizes.
  # Keep this boundary intact: a future upstream catalog update must be able
  # to replace the block above without touching these.

  # Generalizes: truncated ChaCha20-Poly1305 tag comparison (CWE-187);
  # ECDH public point not validated against the selected curve (CWE-347).
  # query_modules names a planned module; the query does not exist yet.
  # NOTE: authority_point is reused from most migrated entries above; the
  # other three roles do not exist in enum_registry.yml yet.
  - id: TWE-GUARD-004
    family: Guard
    name: Incomplete Cryptographic Verification
    query_modules: [guard/IncompleteCryptographicVerification.ql]
    required_trustir: [verification_operation, verified_input_span, accepted_domain_constraint, authority_point]

  # Generalizes: RSA-OAEP invalid label-hash comparison timing
  # (CVE-2026-41514, CWE-385 Covert Timing Channel); RSA PKCS#1 v1.5
  # decryption timing (CVE-2026-41516, CWE-385, Bleichenbacher-style padding
  # oracle via response latency).
  # query_modules names a planned module; the query does not exist yet.
  # required_trustir reuses the secret_source / observable_sink role slots
  # from TWE-LEAK-001 and the secret_dependent_branch role slot from
  # TWE-LEAK-002 — those are reused from sibling entries, not newly anchored
  # here. Of the three, only secret_dependent_branch is itself an
  # enum_registry.yml value (a listed trust_source_role); secret_source and
  # observable_sink are role slot names, not registry values.
  # NOTE: constant_time_guard is not in enum_registry.yml — guard_kind's 15
  # terms are all attestation-shaped and none covers timing-safety; flagged
  # for the future fact/query layer.
  - id: TWE-LEAK-003
    family: Leakage
    name: Secret-Dependent Timing Observable
    query_modules: [leakage/SecretDependentTiming.ql]
    required_trustir: [secret_source, secret_dependent_branch, observable_sink, constant_time_guard]

  # Generalizes: over-sized memory-pool allocation left uncleared
  # (CVE-2019-1010294, CWE-226 Sensitive Information in Resource Not Removed
  # Before Reuse); FPU/extended-register state not cleared at enclave entry
  # (CVE-2020-15107, CWE-665 Improper Initialization); host-controlled
  # iovec/length field sized past the intended buffer, exposing adjacent
  # memory (CVE-2020-15224, CWE-200 Exposure of Sensitive Information).
  # query_modules names a planned module; the query does not exist yet.
  # required_trustir reuses boundary_exit, the field TWE-FLOW-002 already
  # established for "value crosses the TEE boundary".
  # NOTE: uninitialized_memory_object, size_source, and clear_or_zero_guard
  # are not in enum_registry.yml — state_object_kind's ten values (sealed_blob,
  # checkpoint, ...) are all versioned/sealed state, not raw uncleared
  # buffers, trust_source_role has no host-controlled-length term, and
  # guard_kind has no zero/clear-on-exit term; flagged for the future
  # fact/query layer.
  - id: TWE-LEAK-004
    family: Leakage
    name: Residual or Uninitialized Memory Crosses a Boundary
    query_modules: [leakage/ResidualMemoryCrossesBoundary.ql]
    required_trustir: [uninitialized_memory_object, boundary_exit, size_source, clear_or_zero_guard]

id: TWE-FLOW-001
name: Host-Controlled Input Reaches Security Decision
family: Flow
summary: >
  Untrusted data crossing into the trusted component (host pointer, length,
  or index at an enclave/syscall boundary) reaches a security-relevant
  operation without validation, letting the untrusted side steer a memory
  access, allocation, or branch inside the TEE.
applicable_contexts: [enclave_boundary, syscall_boundary]
required_trustir: [untrusted_input, security_decision]
allowed_enums:
  untrusted_input: [host_pointer, host_length, host_index]
  security_decision: [memory_access, allocation, branch]
codeql_modules:
  - flow/host_controlled_decision_input.ql
violation_condition: >
  untrusted_input reaches security_decision without an intervening validation
  on the boundary path.
accepted_suppressors:
  - validated_at_boundary
  - clamped_before_use
  - test_or_dev_only
fixtures: [CVE-2021-24117]

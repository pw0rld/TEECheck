[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tee-audit"
version = "0.1.0"
description = "TEE×Web3 static audit pipeline — 7-stage CLI tool for auditing TEE usage in blockchain projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
tee-audit = "tee_audit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
